server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location = /healthz {
        access_log off;
        return 200;
    }

    location ~* \.(?:css|js|mjs|map|woff2?|ttf|svg|png|jpe?g|gif|ico)$ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # BrowserRouter routes must always boot the SPA rather than return a 404.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
